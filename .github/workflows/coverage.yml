name: Check NISAR coverage

# Free for public repositories. Asks NASA's public ASF search (no login, no key)
# which NISAR products exist over every hotspot, then commits data/coverage.json.
on:
  schedule:
    - cron: "17 3 * * 1"   # every Monday at 03:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r pipeline/requirements.txt
      - run: python pipeline/update_coverage.py
      - name: Commit the updated coverage
        run: |
          if git diff --quiet data/coverage.json; then
            echo "Coverage unchanged."
            exit 0
          fi
          git config user.name "sarabande-bot"
          git config user.email "sarabande-bot@users.noreply.github.com"
          git add data/coverage.json
          git commit -m "Update NISAR coverage"
          git push
